<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BM Database — запуск...</title>
<style>
  body {
    margin: 0; background: #0f1117;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #e2e8f0;
  }
  .box { text-align: center; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #1e2030;
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { font-size: 1.1rem; font-weight: 500; color: #94a3b8; margin: 0; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h2 id="status">Запуск BM Database...</h2>
</div>
<script>
const STORAGE_KEY = "bm-database-v1";
const SERVER      = "http://localhost:8080";

async function run() {
  const statusEl = document.getElementById("status");

  // 1. Wait for server to be available
  statusEl.textContent = "Подключение к серверу...";
  let serverReady = false;
  for (let i = 0; i < 10; i++) {
    try {
      const res = await fetch(SERVER + "/api/data", { mode: "cors" });
      if (res.ok) { serverReady = true; break; }
    } catch { /* not ready yet */ }
    await new Promise(r => setTimeout(r, 500));
  }

  if (!serverReady) {
    statusEl.textContent = "Сервер не запущен. Откройте «Запустить BM Database.bat» от имени Администратора.";
    return;
  }

  // 2. Check if server already has data
  try {
    const res  = await fetch(SERVER + "/api/data", { mode: "cors" });
    const json = await res.json();
    if (json.isSetup) {
      // Server already has data — go straight there
      window.location.href = SERVER;
      return;
    }
  } catch { /* ignore */ }

  // 3. Try to migrate data from this browser's localStorage (file:// origin)
  const localRaw = localStorage.getItem(STORAGE_KEY);
  if (localRaw) {
    statusEl.textContent = "Перенос данных на сервер...";
    try {
      await fetch(SERVER + "/api/data", {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "application/json" },
        body: localRaw,
      });
      // Clear old localStorage after successful migration
      localStorage.removeItem(STORAGE_KEY);
      statusEl.textContent = "Готово! Перенаправление...";
    } catch {
      statusEl.textContent = "Ошибка переноса. Попробуйте снова.";
      return;
    }
  }

  // 4. Go to the app
  window.location.href = SERVER;
}

run();
</script>
</body>
</html>
